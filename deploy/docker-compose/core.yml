version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:v25.1.3
    command:
      - redpanda
      - start
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "${MINT_DEV_REDPANDA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${MINT_DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  scylla:
    image: scylladb/scylla:6.2
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1", "--reactor-backend=epoll", "--api-address", "0.0.0.0"]
    ports:
      - "${MINT_DEV_SCYLLA_PORT:-9042}:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 15s
      timeout: 10s
      retries: 20

  core:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - ../../:/workspace
      - mint-go-mod-cache:/go/pkg/mod
      - mint-go-build-cache:/root/.cache/go-build
    command: ["go", "run", "./cmd/core"]
    environment:
      MINT_CORE_HTTP_ADDR: ":8091"
      MINT_CORE_GRPC_ADDR: ":9091"
      MINT_KAFKA_BROKERS: "redpanda:9092"
      MINT_CORE_WORKSPACE_COMMANDS_TOPIC: "mint.workspace.commands.v1"
      MINT_CORE_WORKSPACE_EVENTS_TOPIC: "mint.workspace.events.v1"
      MINT_CORE_WORKSPACE_CONSUMER_GROUP: "mint.core.workspace.v1"
      MINT_RTC_COMMANDS_TOPIC: "mint.rtc.commands.v1"
      MINT_REDIS_ADDR: "redis:6379"
      MINT_REDIS_KEY_PREFIX: "mint:core"
      MINT_SCYLLA_HOSTS: "scylla"
      MINT_SCYLLA_KEYSPACE: "mint_core"
      MINT_SCYLLA_AUTO_CREATE_SCHEMA: "true"
      MINT_CORE_JWT_ACCESS_SECRET: "dev-access-secret"
      MINT_CORE_JWT_REFRESH_SECRET: "dev-refresh-secret"
      MINT_RTC_GRPC_ADDR: "rtc-api:9093"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylla:
        condition: service_healthy
      rtc-api:
        condition: service_started
    ports:
      - "${MINT_DEV_CORE_HTTP_PORT:-8091}:8091"
      - "${MINT_DEV_CORE_GRPC_PORT:-9091}:9091"

  rtc-api:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - ../../:/workspace
      - mint-go-mod-cache:/go/pkg/mod
      - mint-go-build-cache:/root/.cache/go-build
    command: ["go", "run", "./cmd/rtc-api"]
    environment:
      MINT_RTC_HTTP_ADDR: ":8093"
      MINT_RTC_GRPC_ADDR: ":9093"
      MINT_KAFKA_BROKERS: "redpanda:9092"
      MINT_RTC_EVENTS_TOPIC: "mint.rtc.events.v1"
      MINT_RTC_COMMANDS_TOPIC: "mint.rtc.commands.v1"
      MINT_RTC_KAFKA_CONSUMER_GROUP: "mint.rtc-api.v1"
      MINT_REDIS_ADDR: "redis:6379"
      MINT_SCYLLA_HOSTS: "scylla"
      MINT_SCYLLA_KEYSPACE: "mint_rtc"
      MINT_SCYLLA_AUTO_CREATE_SCHEMA: "true"
      MINT_LIVEKIT_URL: "http://livekit:7880"
      MINT_LIVEKIT_API_KEY: "devkey"
      MINT_LIVEKIT_API_SECRET: "devsecret"
      MINT_PERMISSION_GRPC_ADDR: "core:9091"
      MINT_PERMISSION_TIMEOUT: "300ms"
      MINT_PERMISSION_MAX_RETRIES: "2"
      MINT_PERMISSION_RETRY_BACKOFF: "100ms"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylla:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "${MINT_DEV_RTC_HTTP_PORT:-8093}:8093"
      - "${MINT_DEV_RTC_GRPC_PORT:-9093}:9093"

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey:devsecret"]
    ports:
      - "${MINT_DEV_LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${MINT_DEV_LIVEKIT_UDP_PORT:-7881}:7881/udp"

volumes:
  mint-go-mod-cache:
  mint-go-build-cache:
